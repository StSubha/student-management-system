<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>
</head>
<body>
    <h1>Student Record System</h1>
    <a href="/add/">Add Student</a>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Roll</th>
            <th>Email</th>
            <th>Course</th>
            <th>Actions</th>
        </tr>
        {% for student in students %}
        <tr>
            <td>{{ student.name }}</td>
            <td>{{ student.roll }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.course }}</td>
            <td>
                <a href="/update/{{ student.id }}/">Edit</a> |
                <a href="/delete/{{ student.id }}/">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
